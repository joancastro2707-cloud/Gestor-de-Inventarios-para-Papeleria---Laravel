name: CI - Auditoría de Calidad y Seguridad

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  phpstan-and-security:
    name: Análisis Estático (PHPStan) y Auditoría
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, gd
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar PHPStan (Análisis estático)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Auditoría de vulnerabilidades en dependencias PHP
        run: composer audit
        continue-on-error: true